   document.querySelectorAll('button[data-action=\"csv\"]').forEach(b => {\n      if (b.dataset.pngAdded) return; b.dataset.pngAdded = '1';\n      b.insertAdjacentHTML('afterend', '\u003cbutton type=\"button\" class=\"ijt-png-btn\" data-png=\"card\">Download PNG\u003c/button>\u003cbutton type=\"button\" class=\"ijt-png-btn t\" data-png=\"transparent\">Transparent PNG\u003c/button>');\n    });\n    // collapsible references\n    document.querySelectorAll('section.research-references').forEach(sec => {\n      if (sec.dataset.toggled) return; sec.dataset.toggled = '1';\n      const h = sec.querySelector('h2'); const title = h ? h.textContent.trim() : 'References';\n      const works = sec.querySelectorAll('strong').length ? [...sec.querySelectorAll('strong')].filter(s => /Taneja/.test(s.textContent)).length : 0;\n      const det = document.createElement('details'); det.className = 'ref-toggle';\n      det.innerHTML = '\u003csummary>\u003cspan class=\"ref-title\">\u003c/span>\u003cspan class=\"ref-hint\">\u003c/span>\u003c/summary>';\n      det.querySelector('.ref-title').textContent = title;\n      det.querySelector('.ref-hint').textContent = (works ? works + ' research works · ' : '') + 'click to show / hide';\n      [...sec.childNodes].forEach(nd => { if (nd !== h) det.appendChild(nd); });\n      if (h) h.remove();\n      sec.appendChild(det);\n      det.addEventListener('toggle', remeasure);\n    });\n  }\n  new MutationObserver(() => { prep(); }).observe(document.body, {childList:true, subtree:true});\n  prep(); remeasure();\n\n  /* ---------- PNG export ---------- */\n  document.addEventListener('click', e => {\n    const b = e.target.closest('button[data-png]'); if (!b) return;\n    const box = b.closest('.card') || b.closest('section') || document;\n    const table = box.querySelector('table.glass-sq') || document.querySelector('table.glass-sq');\n    if (!table){ alert('Enter all parameters first — then the PNG can be made.'); return; }\n    exportPNG(box, table, b.dataset.png === 'transparent');\n  });\n  function readSquare(box, t){\n    const rows = [...t.rows], n = rows.length - 2;\n    const st = box.querySelector('#status,[data-role=\"status\"],.status') || document.getElementById('status');\n    const m = ((st && st.textContent) || '').match(/sum = ([^ ·]+)/);\n    const txt = c => { const bt = c && c.querySelector('button'); return bt ? bt.textContent.trim() : ''; };\n    const head = rows[0].cells, last = rows[n + 1].cells;\n    const titleEl = box.querySelector('h2#title') || document.getElementById('title') || box.querySelector('h2');\n    return {\n      n, target: m ? m[1] : null,\n      cls: ((t.querySelector('.classification-oval') || {}).textContent || '').trim(),\n      cells: rows.slice(1, n + 1).map(r => [...r.cells].slice(1, n + 1).map(td => {\n        const cs = getComputedStyle(td);\n        return {t: td.textContent.trim(), bg: cs.backgroundColor, fg: cs.color,\n          top: !!td.dataset.bt, bottom: !!td.dataset.bb, left: !!td.dataset.bl, right: !!td.dataset.br};\n      })),\n      top: [...head].slice(1, n + 1).map(txt), tr: txt(head[n + 1]),\n      left: rows.slice(1, n + 1).map(r => txt(r.cells[0])), right: rows.slice(1, n + 1).map(r => txt(r.cells[r.cells.length - 1])),\n      bottom: [...last].slice(1, n + 1).map(txt), br: txt(last[n + 1]),\n      title: titleEl ? titleEl.textContent.trim() : 'Magic square'\n    };\n  }\n  function rr(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }\n  const PAL = {3:['#f6f1ff','#ebe2fb','#ddd0f6'],4:['#f0f6ff','#e0ecfb','#cddff6'],5:['#f3f3ff','#e4e5fb','#d3d5f4'],6:['#f3f6fa','#e3e9f1','#d0d9e6'],\n               7:['#f6f1ff','#ebe2fb','#ddd0f6'],8:['#f0f6ff','#e0ecfb','#cddff6'],9:['#f3f3ff','#e4e5fb','#d3d5f4'],10:['#f3f6fa','#e3e9f1','#d0d9e6'],\n               11:['#effafb','#dcf1f3','#c6e6ea'],12:['#faf3f7','#efe1ea','#e0ccd9']};\n  function exportPNG(box, table, transparent){\n    const D = readSquare(box, table), n = D.n;\n    const cs = Math.max(56, Math.min(130, Math.floor(1000 / n))), gap = Math.round(cs * 0.11), side = Math.round(cs * 1.15);\n    const gridW = n * cs + (n - 1) * gap;\n    const W = gridW + 2 * side + 120, topH = transparent ? 30 : 190, H = topH + side * 0.75 + gridW + side * 0.9 + (transparent ? 30 : 110);\n    const cv = document.createElement('canvas'); cv.width = Math.round(W); cv.height = Math.round(H);\n    const x = cv.getContext('2d'), gx = (W - gridW) / 2, gy = topH + side * 0.75;\n    if (!transparent){\n      const pc = PAL[n] || ['#fffbf2','#fdf3dc','#f6e6c0'];\n      const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, pc[0]); g.addColorStop(.6, pc[1]); g.addColorStop(1, pc[2]);\n      x.fillStyle = g; rr(x, 12, 12, W - 24, H - 24, 32); x.fill();\n      x.lineWidth = 6; x.strokeStyle = '#d9b46a'; rr(x, 12, 12, W - 24, H - 24, 32); x.stroke();\n      x.lineWidth = 2; x.strokeStyle = 'rgba(217,180,106,.6)'; rr(x, 28, 28, W - 56, H - 56, 24); x.stroke();\n      x.textAlign = 'center'; x.textBaseline = 'alphabetic';\n      x.fillStyle = '#5b2c83'; x.font = '600 30px Georgia, serif'; x.fillText('Algebraic Magic Squares — Reduced Entries', W / 2, 80);\n      x.fillStyle = '#a8781a'; x.font = '700 46px Georgia, serif'; x.fillText(D.title, W / 2, 136);\n      x.fillStyle = '#4a4458'; x.font = 'italic 26px Georgia, serif';\n      x.fillText(D.cls + '  ·  ' + n + '×' + n + (D.target ? '  ·  magic sum ' + D.target : ''), W / 2, 176);\n    }\n    const sumFont = t => Math.max(14, Math.min(Math.round(cs * 0.32), Math.round(cs * 1.7 / Math.max(3, t.length))));\n    const sum = (t, cx, cy, isPan) => {\n      if (!t) return;\n      const ok = D.target === null ? null : t === D.target;\n      x.font = '700 ' + sumFont(t) + 'px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';\n      if (transparent){ x.lineWidth = 5; x.lineJoin = 'round'; x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(t, cx, cy); }\n      x.fillStyle = ok === false ? '#b4304f' : isPan ? '#1b7f4b' : '#a8781a'; x.fillText(t, cx, cy);\n    };\n    D.cells.forEach((row, r) => row.forEach((c, k) => {\n      const px = gx + k * (cs + gap), py = gy + r * (cs + gap), rad = cs * 0.15;\n      x.save(); x.shadowColor = 'rgba(70,50,20,.28)'; x.shadowBlur = cs * 0.12; x.shadowOffsetY = cs * 0.05;\n      x.globalAlpha = transparent ? 0.88 : 1; x.fillStyle = c.bg; rr(x, px, py, cs, cs, rad); x.fill(); x.restore();\n      const gl = x.createLinearGradient(px, py, px + cs, py + cs);\n      gl.addColorStop(0, 'rgba(255,255,255,.7)'); gl.addColorStop(.35, 'rgba(255,255,255,.22)'); gl.addColorStop(.58, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(70,45,10,.08)');\n      x.fillStyle = gl; rr(x, px, py, cs, cs, rad); x.fill();\n      x.lineWidth = Math.max(1.5, cs * 0.02); x.strokeStyle = 'rgba(255,255,255,.85)'; rr(x, px, py, cs, cs, rad); x.stroke();\n      const t = c.t, fs = Math.max(12, Math.min(Math.round(cs * 0.42), Math.round(cs * 1.7 / Math.max(2, t.length))));\n      x.font = '700 ' + fs + 'px Georgia, \"Times New Roman\", serif'; x.textAlign = 'center'; x.textBaseline = 'middle';\n      x.fillStyle = c.fg; x.fillText(t, px + cs / 2, py + cs / 2 + 2);\n    }));\n    // structure lines in the gaps\n    x.save(); x.strokeStyle = '#17364b'; x.lineWidth = Math.max(3, cs * 0.04); x.lineCap = 'square';\n    const h = gap / 2, seg = (a, b, c, d) => { x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); };\n    D.cells.forEach((row, r) => row.forEach((c, k) => {\n      const px = gx + k * (cs + gap), py = gy + r * (cs + gap);\n      if (c.top) seg(px - h, py - h, px + cs + h, py - h);\n      if (c.bottom) seg(px - h, py + cs + h, px + cs + h, py + cs + h);\n      if (c.left) seg(px - h, py - h, px - h, py + cs + h);\n      if (c.right) seg(px + cs + h, py - h, px + cs + h, py + cs + h);\n    }));\n    x.restore();\n    const colX = k => gx + k * (cs + gap) + cs / 2, rowY = r => gy + r * (cs + gap) + cs / 2;\n    const topY = gy - side * 0.45, botY = gy + gridW + side * 0.45, leftX = gx - side * 0.55, rightX = gx + gridW + side * 0.55;\n    if (D.cls === 'Panmagic'){\n      D.top.forEach((t, k) => sum(t, colX(k), topY, true));\n      D.left.forEach((t, r) => sum(t, leftX, rowY(r), true));\n    }\n    sum(D.tr, rightX, topY, false);\n    D.right.forEach((t, r) => sum(t, rightX, rowY(r), false));\n    D.bottom.forEach((t, k) => sum(t, colX(k), botY, false));\n    sum(D.br, rightX, botY, false);\n    x.font = '700 ' + Math.round(cs * 0.22) + 'px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#5b2c83';\n    if (transparent){ x.lineWidth = 4; x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(n + '×' + n, leftX, botY); }\n    x.fillText(n + '×' + n, leftX, botY);\n    if (!transparent){ x.fillStyle = '#5b5465'; x.font = 'italic 24px Georgia, serif'; x.textBaseline = 'alphabetic'; x.fillText('Inder J. Taneja · numbers-magic.com', W / 2, H - 46); }\n    cv.toBlob(blob => {\n      const url = URL.createObjectURL(blob), a = document.createElement('a');\n      a.href = url; a.download = (transparent ? 'magic_square_transparent_' : 'magic_square_') + D.title.replace(/\\s*[—-]?\\s*\\d+\\s*[×x]\\s*\\d+/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') + '_' + n + 'x' + n + '.png';\n      a.style.display = 'none'; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);\n    }, 'image/png');\n  }\n})();\n\u003c/script>\n\u003c/body>\u003c/html>\n", "10": "\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Algebraic Magic Squares — Reduced Entries Generator — Order 10×10\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e2f2ed,#ee t-weight:700}.fail{color:#a33030;font-weight:700}.status{padding:12px;background:#edf3f5;border-left:5px solid #34809b;margin:15px 0}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.tools button{background:#f7d9c7;border:1px solid #dca985;color:#814b2b}.scroll{overflow:auto}table{border-collapse:collapse}table.square{margin:auto}td,th{border:1px solid #47636d;padding:9px;text-align:center}.square td{min-width:64px;font:700 21px Cambria,Georgia,serif}.square td.free{color:#0057b8}.square th{font-size:13px;background:#e8f0f3;min-width:44px}.square td.pick{outline:3px solid #db922d;outline-offset:-4px}.sum{display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor;border-radius:50%;background:transparent;color:#226439;font-size:13px;padding:4px;min-width:2.5em;min-height:2.5em}.sum.fail{color:#a33030}.sum:hover{background:#dcebee}.line{padding:10px;background:#f9edd6;border-left:4px solid #d58d25;margin:15px 0;overflow-wrap:anywhere}.verification{width:100%;font-size:.86rem;margin:15px 0}.verification th{background:#e5dcec}.verification td{text-align:left;overflow-wrap:anywhere}.verification caption{text-align:left;font-weight:700;margin-bottom:8px}details{padding:15px;background:#f2f7f8;border:1px solid #a9caca;border-radius:10px;margin-top:20px}summary{cursor:pointer;font-weight:700;color:white;background:linear-gradient(110deg,#102f45,#185562);padding:12px 16px;border-radius:7px}.formulas{width:100%;table-layout:fixed;margin-top:15px}.formulas td{font:700 .8rem/1.5 'Segoe UI';padding:13px 7px;overflow-wrap:anywhere;min-width:0}footer{text-align:center;padding:25px;font-size:.9rem}a{color:#267b79}@media(max-width:850px){.inputs{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:550px){main{padding:12px}.panel{padding:15px}header{padding:20px}h1{font-size:2rem}.inputs{grid-template-columns:repeat(3,minmax(0,1fr))}.square td{min-width:48px;font-size:18px;padding:6px}.formulas{min-width:900px}}\n\n.square td.pick{outline:3px solid #0057d9 !important;outline-offset:-5px !important;box-shadow:inset 0 0 0 2px #ffffff,inset 0 0 0 6px #0057d9 !important;position:relative;z-index:1}\nh1 .main-title{font-family:Georgia,\"Palatino Linotype\",serif;font-style:italic;font-weight:700;color:#fff0ce;letter-spacing:.015em;text-shadow:0 2px 3px #061e3540}\n.classification-oval{display:inline-flex;align-items:center;justify-content:center;min-width:88px;padding:8px 12px;border:1px solid #c5a548;border-radius:50%;background:linear-gradient(135deg,#fff9d1,#ffe18a);color:#17364b;white-space:nowrap}.order-marker{display:inline-flex;align-items:center;justify-content:center;min-width:72px;padding:8px 12px;border:1px solid #729fc2;border-radius:50%;background:linear-gradient(135deg,#e3f5ff,#a8caee);font:700 15px Georgia,serif;color:#17364b}\n\n.inputs label:last-child{background:linear-gradient(135deg,#e6f7dc,#b9dfac);color:#245b32;border-left-color:#39864d}.inputs label:last-child input{background:#f7fff4;color:#245b32;border-color:#6aa676;font-weight:700}\n\n/* Gradient presentation for numerical and algebraic square cells. */\n.square:not(.formula-square):not(.formulas) td{background-image:linear-gradient(135deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.42) 35%,rgba(255,255,255,.02) 65%,rgba(72,39,8,.28) 100%)!important;text-shadow:0 1px 0 rgba(255,255,255,.45)}\n.square.formulas td,.square.formula-square td{background-image:linear-gradient(135deg,rgba(255,255,255,.68),rgba(242,227,255,.22) 60%,rgba(81,50,108,.10))!important}\n.square{box-shadow:0 4px 14px rgba(23,54,75,.09)}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003csection class=\"panel types\">\u003ch2>TYPE — ORDER 10×10\u003c/h2>\u003cdiv id=\"types\">\u003ch3>Normal\u003c/h3>\u003cdiv id=\"normalTypes\" class=\"controls\">\u003c/div>\u003ch3>Pandiagonals\u003c/h3>\u003cdiv id=\"panTypes\" class=\"controls\">\u003c/div>\u003c/div>\u003cp class=\"note\">The ordinary magic constructions appear under Normal; the pandiagonal constru <script id="ijt-wrap-script">
(function(){
  const root = document.querySelector('[id^="ijt-generator-"]'); if (!root) return;
  const BG = {blue:'linear-gradient(160deg,#dcebfb 0%,#d2e3f8 50%,#c9daf4 100%)', yellow:'linear-gradient(160deg,#fdf3cf 0%,#fbecbd 50%,#f7e3a9 100%)', mint:'linear-gradient(160deg,#dcf4e8 0%,#cdeedd 50%,#bfe7d2 100%)'};
  let tiles = 'glass', bg = 'orig';
  try { tiles = localStorage.getItem('ijt-re-tiles') || 'glass'; bg = localStorage.getItem('ijt-re-bg') || 'orig'; } catch(e){}
  const header = root.querySelector('header');
  const row = document.createElement('div'); row.className = 'ijt-pick-row';
  row.innerHTML = '<div class="ijt-pick" title="Page background (cards and tiles stay the same)"><span>Background</span>'
    + '<button type="button" data-bg="orig" title="Original" aria-label="Original background"></button><button type="button" data-bg="blue" title="Light blue" aria-label="Light blue background"></button>'
    + '<button type="button" data-bg="yellow" title="Light yellow" aria-label="Light yellow background"></button><button type="button" data-bg="mint" title="Light mint" aria-label="Light mint background"></button></div>'
    + '<div class="ijt-pick" title="Tile style"><span>Tiles</span><button type="button" data-tiles="glass" title="Glass 3D tiles" aria-label="Glass tiles"></button><button type="button" data-tiles="classic" title="Classic table" aria-label="Classic tiles"></button></div>';
  if (header) header.insertBefore(row, header.firstChild);
  const frames = () => [...root.querySelectorAll('iframe')];
  function send(f){ try { f.contentWindow.postMessage({kind:'ijt-style', tiles, bg}, '*'); } catch(e){} }
  function apply(){
    root.style.background = BG[bg] || '';
    row.querySelectorAll('button[data-bg]').forEach(b => b.classList.toggle('on', b.dataset.bg === bg));
    row.querySelectorAll('button[data-tiles]').forEach(b => b.classList.toggle('on', b.dataset.tiles === tiles));
    try { localStorage.setItem('ijt-re-tiles', tiles); localStorage.setItem('ijt-re-bg', bg); } catch(e){}
    frames().forEach(send);
  }
  row.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.bg) bg = b.dataset.bg; if (b.dataset.tiles) tiles = b.dataset.tiles; apply();
  });
  // frames are created on demand: send the current choice when each one loads
  new MutationObserver(() => frames().forEach(f => { if (!f.dataset.ijtHooked){ f.dataset.ijtHooked = '1'; f.addEventListener('load', () => send(f)); } }))
    .observe(root, {childList:true, subtree:true});
  frames().forEach(f => { f.dataset.ijtHooked = '1'; f.addEventListener('load', () => send(f)); });
  apply();
})();
</script>
