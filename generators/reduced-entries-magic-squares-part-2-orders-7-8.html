if (thick(cs.borderBottomWidth)) td.dataset.bb = '1';\n        if (thick(cs.borderLeftWidth)) td.dataset.bl = '1';\n        if (thick(cs.borderRightWidth)) td.dataset.br = '1';\n      });\n      const [ts, tf, gap] = SIZES(n);\n      t.style.setProperty('--ts', ts); t.style.setProperty('--tf', tf); t.style.setProperty('--gap', gap);\n      t.dataset.n = String(n);\n      const cls = ((t.querySelector('.classification-oval') || {}).textContent || '').trim();\n      t.classList.toggle('not-pan', cls !== 'Panmagic');\n      t.classList.add('glass-sq');\n    });\n    // PNG buttons next to every \"Download CSV\"\n    document.querySelectorAll('button[data-action=\"csv\"]').forEach(b => {\n      if (b.dataset.pngAdded) return; b.dataset.pngAdded = '1';\n      b.insertAdjacentHTML('afterend', '\u003cbutton type=\"button\" class=\"ijt-png-btn\" data-png=\"card\">Download PNG\u003c/button>\u003cbutton type=\"button\" class=\"ijt-png-btn t\" data-png=\"transparent\">Transparent PNG\u003c/button>');\n    });\n    // collapsible references\n    document.querySelectorAll('section.research-references').forEach(sec => {\n      if (sec.dataset.toggled) return; sec.dataset.toggled = '1';\n      const h = sec.querySelector('h2'); const title = h ? h.textContent.trim() : 'References';\n      const works = sec.querySelectorAll('strong').length ? [...sec.querySelectorAll('strong')].filter(s => /Taneja/.test(s.textContent)).length : 0;\n      const det = document.createElement('details'); det.className = 'ref-toggle';\n      det.innerHTML = '\u003csummary>\u003cspan class=\"ref-title\">\u003c/span>\u003cspan class=\"ref-hint\">\u003c/span>\u003c/summary>';\n      det.querySelector('.ref-title').textContent = title;\n      det.querySelector('.ref-hint').textContent = (works ? works + ' research works · ' : '') + 'click to show / hide';\n      [...sec.childNodes].forEach(nd => { if (nd !== h) det.appendChild(nd); });\n      if (h) h.remove();\n      sec.appendChild(det);\n      det.addEventListener('toggle', remeasure);\n    });\n  }\n  new MutationObserver(() => { prep(); }).observe(document.body, {childList:true, subtree:true});\n  prep(); remeasure();\n\n  /* ---------- PNG export ---------- */\n  document.addEventListener('click', e => {\n    const b = e.target.closest('button[data-png]'); if (!b) return;\n    const box = b.closest('.card') || b.closest('section') || document;\n    const table = box.querySelector('table.glass-sq') || document.querySelector('table.glass-sq');\n    if (!table){ alert('Enter all parameters first — then the PNG can be made.'); return; }\n    exportPNG(box, table, b.dataset.png === 'transparent');\n  });\n  function readSquare(box, t){\n    const rows = [...t.rows], n = rows.length - 2;\n    const st = box.querySelector('#status,[data-role=\"status\"],.status') || document.getElementById('status');\n    const m = ((st && st.textContent) || '').match(/sum = ([^ ·]+)/);\n    const txt = c => { const bt = c && c.querySelector('button'); return bt ? bt.textContent.trim() : ''; };\n    const head = rows[0].cells, last = rows[n + 1].cells;\n    const titleEl = box.querySelector('h2#title') || document.getElementById('title') || box.querySelector('h2');\n    return {\n      n, target: m ? m[1] : null,\n      cls: ((t.querySelector('.classification-oval') || {}).textContent || '').trim(),\n      cells: rows.slice(1, n + 1).map(r => [...r.cells].slice(1, n + 1).map(td => {\n        const cs = getComputedStyle(td);\n        return {t: td.textContent.trim(), bg: cs.backgroundColor, fg: cs.color,\n          top: !!td.dataset.bt, bottom: !!td.dataset.bb, left: !!td.dataset.bl, right: !!td.dataset.br};\n      })),\n      top: [...head].slice(1, n + 1).map(txt), tr: txt(head[n + 1]),\n      left: rows.slice(1, n + 1).map(r => txt(r.cells[0])), right: rows.slice(1, n + 1).map(r => txt(r.cells[r.cells.length - 1])),\n      bottom: [...last].slice(1, n + 1).map(txt), br: txt(last[n + 1]),\n      title: titleEl ? titleEl.textContent.trim() : 'Magic square'\n    };\n  }\n  function rr(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }\n  const PAL = {3:['#f6f1ff','#ebe2fb','#ddd0f6'],4:['#f0f6ff','#e0ecfb','#cddff6'],5:['#f3f3ff','#e4e5fb','#d3d5f4'],6:['#f3f6fa','#e3e9f1','#d0d9e6'],\n               7:['#f6f1ff','#ebe2fb','#ddd0f6'],8:['#f0f6ff','#e0ecfb','#cddff6'],9:['#f3f3ff','#e4e5fb','#d3d5f4'],10:['#f3f6fa','#e3e9f1','#d0d9e6'],\n               11:['#effafb','#dcf1f3','#c6e6ea'],12:['#faf3f7','#efe1ea','#e0ccd9']};\n  function exportPNG(box, table, transparent){\n    const D = readSquare(box, table), n = D.n;\n    const cs = Math.max(56, Math.min(130, Math.floor(1000 / n))), gap = Math.round(cs * 0.11), side = Math.round(cs * 1.15);\n    const gridW = n * cs + (n - 1) * gap;\n    const W = gridW + 2 * side + 120, topH = transparent ? 30 : 190, H = topH + side * 0.75 + gridW + side * 0.9 + (transparent ? 30 : 110);\n    const cv = document.createElement('canvas'); cv.width = Math.round(W); cv.height = Math.round(H);\n    const x = cv.getContext('2d'), gx = (W - gridW) / 2, gy = topH + side * 0.75;\n    if (!transparent){\n      const pc = PAL[n] || ['#fffbf2','#fdf3dc','#f6e6c0'];\n      const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, pc[0]); g.addColorStop(.6, pc[1]); g.addColorStop(1, pc[2]);\n      x.fillStyle = g; rr(x, 12, 12, W - 24, H - 24, 32); x.fill();\n      x.lineWidth = 6; x.strokeStyle = '#d9b46a'; rr(x, 12, 12, W - 24, H - 24, 32); x.stroke();\n      x.lineWidth = 2; x.strokeStyle = 'rgba(217,180,106,.6)'; rr(x, 28, 28, W - 56, H - 56, 24); x.stroke();\n      x.textAlign = 'center'; x.textBaseline = 'alphabetic';\n      x.fillStyle = '#5b2c83'; x.font = '600 30px Georgia, serif'; x.fillText('Algebraic Magic Squares — Reduced Entries', W / 2, 80);\n      x.fillStyle = '#a8781a'; x.font = '700 46px Georgia, serif'; x.fillText(D.title, W / 2, 136);\n      x.fillStyle = '#4a4458'; x.font = 'italic 26px Georgia, serif';\n      x.fillText(D.cls + '  ·  ' + n + '×' + n + (D.target ? '  ·  magic sum ' + D.target : ''), W / 2, 176);\n    }\n    const sumFont = t => Math.max(14, Math.min(Math.round(cs * 0.32), Math.round(cs * 1.7 / Math.max(3, t.length))));\n    const sum = (t, cx, cy, isPan) => {\n      if (!t) return;\n      const ok = D.target === null ? null : t === D.target;\n      x.font = '700 ' + sumFont(t) + 'px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';\n      if (transparent){ x.lineWidth = 5; x.lineJoin = 'round'; x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(t, cx, cy); }\n      x.fillStyle = ok === false ? '#b4304f' : isPan ? '#1b7f4b' : '#a8781a'; x.fillText(t, cx, cy);\n    };\n    D.cells.forEach((row, r) => row.forEach((c, k) => {\n      const px = gx + k * (cs + gap), py = gy + r * (cs + gap), rad = cs * 0.15;\n      x.save(); x.shadowColor = 'rgba(70,50,20,.28)'; x.shadowBlur = cs * 0.12; x.shadowOffsetY = cs * 0.05;\n      x.globalAlpha = transparent ? 0.88 : 1; x.fillStyle = c.bg; rr(x, px, py, cs, cs, rad); x.fill(); x.restore();\n      const gl = x.createLinearGradient(px, py, px + cs, py + cs);\n      gl.addColorStop(0, 'rgba(255,255,255,.7)'); gl.addColorStop(.35, 'rgba(255,255,255,.22)'); gl.addColorStop(.58, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(70,45,10,.08)');\n      x.fillStyle = gl; rr(x, px, py, cs, cs, rad); x.fill();\n      x.lineWidth = Math.max(1.5, cs * 0.02); x.strokeStyle = 'rgba(255,255,255,.85)'; rr(x, px, py, cs, cs, rad); x.stroke();\n      const t = c.t, fs = Math.max(12, Math.min(Math.round(cs * 0.42), Math.round(cs * 1.7 / Math.max(2, t.length))));\n      x.font = '700 ' + fs + 'px Georgia, \"Times New Roman\", serif'; x.textAlign = 'center'; x.textBaseline = 'middle';\n      x.fillStyle = c.fg; x.fillText(t, px + cs / 2, py + cs / 2 + 2);\n    }));\n    // structure lines in the gaps\n    x.save(); x.strokeStyle = '#17364b'; x.lineWidth = Math.max(3, cs * 0.04); x.lineCap = 'square';\n    const h = gap / 2, seg = (a, b, c, d) => { x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); };\n    D.cells.forEach((row, r) => row.forEach((c, k) => {\n      const px = gx + k * (cs + gap), py = gy + r * (cs + gap);\n      if (c.top) seg(px - h, py - h, px + cs + h, py - h);\n      if (c.bottom) seg(px - h, py + cs + h, px + cs + h, py + cs + h);\n      if (c.left) seg(px - h, py - h, px - h, py + cs + h);\n      if (c.right) seg(px + cs + h, py - h, px + cs + h, py + cs + h);\n    }));\n    x.restore();\n    const colX = k => gx + k * (cs + gap) + cs / 2, rowY = r => gy + r * (cs + gap) + cs / 2;\n    const topY = gy - side * 0.45, botY = gy + gridW + side * 0.45, leftX = gx - side * 0.55, rightX = gx + gridW + side * 0.55;\n    if (D.cls === 'Panmagic'){\n      D.top.forEach((t, k) => sum(t, colX(k), topY, true));\n      D.left.forEach((t, r) => sum(t, leftX, rowY(r), true));\n    }\n    sum(D.tr, rightX, topY, false);\n    D.right.forEach((t, r) => sum(t, rightX, rowY(r), false));\n    D.bottom.forEach((t, k) => sum(t, colX(k), botY, false));\n    sum(D.br, rightX, botY, false);\n    x.font = '700 ' + Math.round(cs * 0.22) + 'px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#5b2c83';\n    if (transparent){ x.lineWidth = 4; x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(n + '×' + n, leftX, botY); }\n    x.fillText(n + '×' + n, leftX, botY);\n    if (!transparent){ x.fillStyle = '#5b5465'; x.font = 'italic 24px Georgia, serif'; x.textBaseline = 'alphabetic'; x.fillText('Inder J. Taneja · numbers-magic.com', W / 2, H - 46); }\n    cv.toBlob(blob => {\n      const url = URL.createObjectURL(blob), a = document.createElement('a');\n      a.href = url; a.download = (transparent ? 'magic_square_transparent_' : 'magic_square_') + D.title.replace(/\\s*[—-]?\\s*\\d+\\s*[×x]\\s*\\d+/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') + '_' + n + 'x' + n + '.png';\n      a.style.display = 'none'; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);\n    }, 'image/png');\n  }\n})();\n\u003c/script>\n\u003c/body>\u003c/html>", "8": "\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Algebraic Magic Squares — Reduced Entries Generator — Order 8×8\u003c/title>\u003cstyle>\n*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e2f2ed,#eee6f3 55%,#fae8df);color:#16364b;font:16px/1.5 'Segoe UI',Arial,sans-serif}main{max-width:1150px;margin:auto;padding:25px}header{background:linear-gradient(120deg,#102f45,#185562 60%,#287879);color:white;padding:25px 28px;border:1px solid #2c6370;border-left:7px solid #62c3b7;border-radius:17px;box-shadow:0 12px 28px #17364b26}h1{font:700 2.6rem/1.35 Georgia,serif;margin:5px 0}h1 span{font-size:.9em}h1 small{font-size:.65em;color:#c2e7e3}.credit{color:#ffda98;font-weight:700}.panel{padding:20px 24px;border:1px solid #a9caca;border-left:6px solid #287c79;border-radius:15px;margin-top:22px;background:#fffefa;box-shadow:0 8px 24px #264d5917}.types{background:linear-gradient(135deg,#eee2f2,#faf5fc);border-color:#c9acd5;border-left-color:#8957a0}.types h2{color:#734389;font:700 .9rem 'Segoe UI';letter-spacing:1px}.controls{display:flex;flex-wrap:wrap;gap:9px}button{font:700 .95rem 'Segoe UI';cursor:pointer;padding:10px 14px;border:1px solid #b7a0c4;border-radius:8px;background:#e8d8ee;color:#68387f}button.active{background:#8957a0;color:white}button:focus-visible,input:focus-visible{outline:3px solid #d69d35;outline-offset:2px}.inputs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:15px;background:#fff4e9;border:1px solid #edcfb7;border-radius:12px}.inputs label{display:block;font-weight:700;background:#ffcf91;border-left:4px solid #0057b8;pad ), gx = (W - gridW) / 2, gy = topH + side * 0.75;\n    if (!transparent){\n      const pc = PAL[n] || ['#fffbf2','#fdf3dc','#f6e6c0'];\n      const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, pc[0]); g.addColorStop(.6, pc[1]); g.addColorStop(1, pc[2]);\n      x.fillStyle = g; rr(x, 12, 12, W - 24, H - 24, 32); x.fill();\n      x.lineWidth = 6; x.strokeStyle = '#d9b46a'; rr(x, 12, 12, W - 24, H - 24, 32); x.stroke();\n      x.lineWidth = 2; x.strokeStyle = 'rgba(217,180,106,.6)'; rr(x, 28, 28, W - 56, H - 56, 24); x.stroke();\n      x.textAlign = 'center'; x.textBaseline = 'alphabetic';\n      x.fillStyle = '#5b2c83'; x.font = '600 30px Georgia, serif'; x.fillText('Algebraic Magic Squares — Reduced Entries', W / 2, 80);\n      x.fillStyle = '#a8781a'; x.font = '700 46px Georgia, serif'; x.fillText(D.title, W / 2, 136);\n      x.fillStyle = '#4a4458'; x.font = 'italic 26px Georgia, serif';\n      x.fillText(D.cls + '  ·  ' + n + '×' + n + (D.target ? '  ·  magic sum ' + D.target : ''), W / 2, 176);\n    }\n    const sumFont = t => Math.max(14, Math.min(Math.round(cs * 0.32), Math.round(cs * 1.7 / Math.max(3, t.length))));\n    const sum = (t, cx, cy, isPan) => {\n      if (!t) return;\n      const ok = D.target === null ? null : t === D.target;\n      x.font = '700 ' + sumFont(t) + 'px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';\n      if (transparent){ x.lineWidth = 5; x.lineJoin = 'round'; x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(t, cx, cy); }\n      x.fillStyle = ok === false ? '#b4304f' : isPan ? '#1b7f4b' : '#a8781a'; x.fillText(t, cx, cy);\n    };\n    D.cells.forEach((row, r) => row.forEach((c, k) => {\n      const px = gx + k * (cs + gap), py = gy + r * (cs + gap), rad = cs * 0.15;\n      x.save(); x.shadowColor = 'rgba(70,50,20,.28)'; x.shadowBlur = cs * 0.12; x.shadowOffsetY = cs * 0.05;\n      x.globalAlpha = transparent ? 0.88 : 1; x.fillStyle = c.bg; rr(x, px, py, cs, cs, rad); x.fill(); x.restore();\n      const gl = x.createLinearGradient(px, py, px + cs, py + cs);\n      gl.addColorStop(0, 'rgba(255,255,255,.7)'); gl.addColorStop(.35, 'rgba(255,255,255,.22)'); gl.addColorStop(.58, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(70,45,10,.08)');\n      x.fillStyle = gl; rr(x, px, py, cs, cs, rad); x.fill();\n      x.lineWidth = Math.max(1.5, cs * 0.02); x.strokeStyle = 'rgba(255,255,255,.85)'; rr(x, px, py, cs, cs, rad); x.stroke();\n      const t = c.t, fs = Math.max(12, Math.min(Math.round(cs * 0.42), Math.round(cs * 1.7 / Math.max(2, t.length))));\n      x.font = '700 ' + fs + 'px Georgia, \"Times New Roman\", serif'; x.textAlign = 'center'; x.textBaseline = 'middle';\n      x.fillStyle = c.fg; x.fillText(t, px + cs / 2, py + cs / 2 + 2);\n    }));\n    // structure lines in the gaps\n    x.save(); x.strokeStyle = '#17364b'; x.lineWidth = Math.max(3, cs * 0.04); x.lineCap = 'square';\n    const h = gap / 2, seg = (a, b, c, d) => { x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); };\n    D.cells.forEach((row, r) => row.forEach((c, k) => {\n      const px = gx + k * (cs + gap), py = gy + r * (cs + gap);\n      if (c.top) seg(px - h, py - h, px + cs + h, py - h);\n      if (c.bottom) seg(px - h, py + cs + h, px + cs + h, py + cs + h);\n      if (c.left) seg(px - h, py - h, px - h, py + cs + h);\n      if (c.right) seg(px + cs + h, py - h, px + cs + h, py + cs + h);\n    }));\n    x.restore();\n    const colX = k => gx + k * (cs + gap) + cs / 2, rowY = r => gy + r * (cs + gap) + cs / 2;\n    const topY = gy - side * 0.45, botY = gy + gridW + side * 0.45, leftX = gx - side * 0.55, rightX = gx + gridW + side * 0.55;\n    if (D.cls === 'Panmagic'){\n      D.top.forEach((t, k) => sum(t, colX(k), topY, true));\n      D.left.forEach((t, r) => sum(t, leftX, rowY(r), true));\n    }\n    sum(D.tr, rightX, topY, false);\n    D.right.forEach((t, r) => sum(t, rightX, rowY(r), false));\n    D.bottom.forEach((t, k) => sum(t, colX(k), botY, false));\n    sum(D.br, rightX, botY, false);\n    x.font = '700 ' + Math.round(cs * 0.22) + 'px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#5b2c83';\n    if (transparent){ x.lineWidth = 4; x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(n + '×' + n, leftX, botY); }\n    x.fillText(n + '×' + n, leftX, botY);\n    if (!transparent){ x.fillStyle = '#5b5465'; x.font = 'italic 24px Georgia, serif'; x.textBaseline = 'alphabetic'; x.fillText('Inder J. Taneja · numbers-magic.com', W / 2, H - 46); }\n    cv.toBlob(blob => {\n      const url = URL.createObjectURL(blob), a = document.createElement('a');\n      a.href = url; a.download = (transparent ? 'magic_square_transparent_' : 'magic_square_') + D.title.replace(/\\s*[—-]?\\s*\\d+\\s*[×x]\\s*\\d+/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') + '_' + n + 'x' + n + '.png';\n      a.style.display = 'none'; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);\n    }, 'image/png');\n  }\n})();\n\u003c/script>\n\u003c/body>\u003c/html>\n"},frames=new Map();let selected=null;

<script id="ijt-wrap-script">
(function(){
  const root = document.querySelector('[id^="ijt-generator-"]'); if (!root) return;
  const BG = {blue:'linear-gradient(160deg,#dcebfb 0%,#d2e3f8 50%,#c9daf4 100%)', yellow:'linear-gradient(160deg,#fdf3cf 0%,#fbecbd 50%,#f7e3a9 100%)', mint:'linear-gradient(160deg,#dcf4e8 0%,#cdeedd 50%,#bfe7d2 100%)'};
  let tiles = 'glass', bg = 'orig';
  try { tiles = localStorage.getItem('ijt-re-tiles') || 'glass'; bg = localStorage.getItem('ijt-re-bg') || 'orig'; } catch(e){}
  const header = root.querySelector('header');
  const row = document.createElement('div'); row.className = 'ijt-pick-row';
  row.innerHTML = '<div class="ijt-pick" title="Page background (cards and tiles stay the same)"><span>Background</span>'
    + '<button type="button" data-bg="orig" title="Original" aria-label="Original background"></button><button type="button" data-bg="blue" title="Light blue" aria-label="Light blue background"></button>'
    + '<button type="button" data-bg="yellow" title="Light yellow" aria-label="Light yellow background"></button><button type="button" data-bg="mint" title="Light mint" aria-label="Light mint background"></button></div>'
    + '<div class="ijt-pick" title="Tile style"><span>Tiles</span><button type="button" data-tiles="glass" title="Glass 3D tiles" aria-label="Glass tiles"></button><button type="button" data-tiles="classic" title="Classic table" aria-label="Classic tiles"></button></div>';
  if (header) header.insertBefore(row, header.firstChild);
  const frames = () => [...root.querySelectorAll('iframe')];
  function send(f){ try { f.contentWindow.postMessage({kind:'ijt-style', tiles, bg}, '*'); } catch(e){} }
  function apply(){
    root.style.background = BG[bg] || '';
    row.querySelectorAll('button[data-bg]').forEach(b => b.classList.toggle('on', b.dataset.bg === bg));
    row.querySelectorAll('button[data-tiles]').forEach(b => b.classList.toggle('on', b.dataset.tiles === tiles));
    try { localStorage.setItem('ijt-re-tiles', tiles); localStorage.setItem('ijt-re-bg', bg); } catch(e){}
    frames().forEach(send);
  }
  row.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.bg) bg = b.dataset.bg; if (b.dataset.tiles) tiles = b.dataset.tiles; apply();
  });
  // frames are created on demand: send the current choice when each one loads
  new MutationObserver(() => frames().forEach(f => { if (!f.dataset.ijtHooked){ f.dataset.ijtHooked = '1'; f.addEventListener('load', () => send(f)); } }))
    .observe(root, {childList:true, subtree:true});
  frames().forEach(f => { f.dataset.ijtHooked = '1'; f.addEventListener('load', () => send(f)); });
  apply();
})();
</script>
