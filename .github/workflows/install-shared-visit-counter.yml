name: Install shared visit counter once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-shared-visit-counter.yml"
permissions:
  contents: write
jobs:
  install-once:
    if: github.repository == 'Ijtaneja/mathematical-generators' && github.event.head_commit.message == 'Install shared visit counter once on all existing generator pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Require the reviewed installation commit
        env:
          INSTALL_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$INSTALL_COMMIT"
      - name: Insert and verify the existing shared counter on every HTML page
        run: python3 scripts/install_shared_visit_counter.py
      - name: Save the page changes and remove this one-time installer
        run: |
          git rm scripts/install_shared_visit_counter.py .github/workflows/install-shared-visit-counter.yml
          git add -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add shared counter to every generator page and remove installer"
          git push origin HEAD:main
