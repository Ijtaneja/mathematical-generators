function sevenDigit(x){const d=document.createElement('i');d.className='dig'+(x==='1'?' one':'');'abcdefg'.split('').forEach(s=>{const q=document.createElement('i');q.className='seg s'+s+(segMap[x].includes(s)?' on':'');d.appendChild(q)});return d}function roundDigit(x){const d=document.createElement('i');d.className='dig glyph-'+x;d.textContent=x;return d}function makeNum(v,kind){const n=document.createElement('span');n.className='num '+kind;String(v).padStart(4,'0').split('').forEach(x=>n.appendChild(kind==='seven'?sevenDigit(x):roundDigit(x)));return n}

designs.forEach(d=>{const card=document.createElement('article');card.className='card '+d.kind;card.innerHTML=`<h2>${d.title}</h2><div class="tag">${d.mirror?'Upside-Down and Mirror-Looking':'Upside-Down Only'} · ${d.digits}</div><div class="scene"><div class="cube"></div></div><div class="local"></div><div class="facebar"></div><div class="readout"><div class="info"><b class="current">Front Magic Sum: ${d.sums[0].toLocaleString('en-US')}</b><span>selected face</span></div><div class="info"><b>${d.digits}</b><span>${d.mirror?'rotation-safe':'180° rotation-safe'} digits</span></div><div class="info"><b class="safe">✓ Six faces verified</b><span class="reading">normal orientation</span></div></div><div class="sums"></div>`;gallery.appendChild(card);const cube=card.querySelector('.cube'),scene=card.querySelector('.scene'),bar=card.querySelector('.facebar'),local=card.querySelector('.local'),sumsEl=card.querySelector('.sums'),chips=[];d.faces.forEach((f,i)=>{const face=document.createElement('section');face.className='face '+pos[i];f.flat().forEach(v=>{const cell=document.createElement('div');cell.className='cell';cell.appendChild(makeNum(v,d.kind));face.appendChild(cell)});cube.appendChild(face);const b=document.createElement('button');b.textContent=names[i];bar.appendChild(b)});d.sums.forEach((s,i)=>{const x=document.createElement('div');x.className='sum'+(i===0?' active':'');x.innerHTML=`<b>${s.toLocaleString('en-US')}</b><span>${names[i]}</span>`;sumsEl.appendChild(x);chips.push(x)});const c={data:d,cube,scene,sum:card.querySelector('.current'),reading:card.querySelector('.reading'),chips,rx:-22,ry:32,half:false,mirrored:false,drag:false,lx:0,ly:0,mirrorBtn:null};controllers.push(c);[...bar.children].forEach((b,i)=>b.onclick=()=>snap(c,i));if(d.mirror){const b=document.createElement('button');b.textContent='Mirror-Looking Design';b.onclick=()=>{c.mirrored=!c.mirrored;b.classList.toggle('active',c.mirrored);update(c);draw(c)};local.appendChild(b);c.mirrorBtn=b}else l
