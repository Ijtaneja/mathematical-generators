designs.forEach(d=>{const card=document.createElement('article');card.className='card '+d.theme;card.innerHTML=`<h2>${d.title}</h2><div class="tag">${d.mirror?'Upside-Down and Mirror-Looking':'Upside-Down Only'} · ${d.digits}</div><div class="scene"><div class="cube"></div></div><div class="local"></div><div class="facebar"></div><div class="readout"><div class="info"><b class="current">Front Magic Sum: ${d.sums[0].toLocaleString('en-US')}</b><span>selected face</span></div><div class="info"><b>${d.digits}</b><span>${d.mirror?'rotation-safe':'180° rotation-safe'} digits</span></div><div class="info"><b class="safe">✓ Faces verified</b><span class="reading">normal orientation</span></div></div><div class="sums"></div>`;gallery.appendChild(card);const cube=card.querySelector('.cube'),scene=card.querySelector('.scene'),bar=card.querySelector('.facebar'),local=card.querySelector('.local'),sumsEl=card.querySelector('.sums'),chips=[];d.faces.forEach((f,i)=>{const face=document.createElement('section');face.className='face '+pos[i];f.flat().forEach((v,j)=>{const cell=document.createElement('div');cell.className='cell'+(((Math.floor(j/8)+j%8)%2)?' alt':'');cell.appendChild(makeNum(v,d.kind));face.appendChild(cell)});cube.appendChild(face);const b=document.createElement('button');b.textContent=names[i];bar.appendChild(b)});d.sums.forEach((s,i)=>{const x=document.createElement('div');x.className='sum'+(i===0?' active':'');x.innerHTML=`<b>${s.toLocaleString('en-US')}</b><span>${names[i]}</span>`;sumsEl.appendChild(x);chips.push(x)});const c={data:d,cube,scene,sum:card.querySelector('.current'),reading:card.querySelector('.reading'),chips,rx:-22,ry:32,half:false,mirrored:false,drag:false,lx:0,ly:0,mirrorBtn:null};controllers.push(c);[...bar.children].forEach((b,i)=>b.onclick=()=>snap(c,i));if(d.mirror){const b=document.createElement('button');b.textContent='Mirror-Looking Design';b.onclick=()=>{c.mirrored=!c.mirrored;b.classList.toggle('active',c.mirrored);update(c);draw(c)};lo let spinning=true,rotationSpeed=.17,transparent=false,halfState=false,mirrorState=false;const spinAll=document.getElementById('spinAll'),halfAll=document.getElementById('halfAll'),mirrorAll=document.getElementById('mirrorAll'),transAll=document.getElementById('transAll'),resetAll=document.getElementById('resetAll');function loop(){if(spinning)controllers.forEach(c=>{if(!c.drag){c.ry+=rotationSpeed;draw(c)}});requestAnimationFrame(loop)}loop();spinAll.onclick=()=>{spinning=!spinning;spinAll.textContent=spinning?'Pause All':'Start All';spinAll.classList.toggle('active',spinning)};halfAll.onclick=()=>{halfState=!halfState;controllers.forEach(c=>{c.half=halfState;c.ry+=180;update(c);draw(c)});halfAll.classList.toggle('active',halfState)};mirrorAll.onclick=()=>{mirrorState=!mirrorState;controllers.filter(c=>c.data.mirror).forEach(c=>{c.mirrored=mirrorState;if(c.mirrorBtn)c.mirrorBtn.classList.toggle('active',mirrorState);update(c);draw(c)});mirrorAll.classList.toggle('active',mirrorState)};transAll.onclick=()=>{transparent=!transparent;controllers.forEach(c=>{c.cube.classList.toggle('transparent',transparent);update(c)});transAll.classList.toggle('active',transparent)};resetAll.onclick=()=>{spinning=false;spinAll.textContent='Start All';spinAll.classList.remove('active');transparent=halfState=mirrorState=false;halfAll.classList.remove('active');mirrorAll.classList.remove('active');transAll.classList.remove('active');controllers.forEach(c=>{c.rx=-22;c.ry=32;c.half=c.mirrored=false;c.cube.classList.remove('transparent');if(c.mirrorBtn)c.mirrorBtn.classList.remove('active');selectFace(c,0);update(c);draw(c)})};speed.oninput=e=>rotationSpeed=+e.target.value;cubeSize.oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');fontSize.oninput=e=>document.documentElement.style.setProperty('--fontScale',e.target.value);
</script></body></html>
