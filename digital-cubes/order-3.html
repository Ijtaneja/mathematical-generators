<header><h1>Four Spinning Digital Magic Cubes — Order 3</h1><div class="sub">Upside-Down and Mirror-Looking: Six Faces Magic Squares</div><div class="by">Created by Inder J. Taneja</div></header>

designs.forEach((d,idx)=>{const s=summaries[idx],card=document.createElement('article');card.className='card '+(d.kind==='seven'?'dark seven':'round');card.innerHTML=`<h2>${d.title}</h2><div class="tag">${d.tag} · Magic Sum: ${s.main}</div><div class="scene"><div class="cube"></div></div><div class="local"></div><div class="note">Drag the cube to rotate manually</div><div class="facebar"></div><div class="readout"><div class="info"><b>Magic Sum: ${s.main}</b><span>same for every row and column</span></div><div class="info"><b>${s.digits}</b><span>${s.digitLabel}</span></div><div class="info"><b class="safe">✓ Six faces verified</b><span class="reading">normal orientation</span></div></div><div class="sums"></div>`;galleryEl.appendChild(card);const cube=card.querySelector('.cube'),scene=card.querySelector('.scene'),local=card.querySelector('.local'),bar=card.querySelector('.facebar'),reading=card.querySelector('.reading'),sumsEl=card.querySelector('.sums'),chips=[];d.faces.forEach((f,i)=>{const face=document.createElement('div');face.className='face '+pos[i];f.flat().forEach(v=>{const cell=document.createElement('div');cell.className='cell';cell.appendChild(makeNum(v,d.kind));face.appendChild(cell)});cube.appendChild(face);const chip=document.createElement('div');chip.className='sum'+(i===0?' active':'');chip.innerHTML=`<b>${s.main}</b><span>${names[i]}</span>`;sumsEl.appendChild(chip);chips.push(chip)});const c={cube,scene,reading,chips,rx:-22,ry:32,mirror:false,canMirror:d.mirror,mirrorBtn:null,half:false,drag:false,lx:0,ly:0};controllers.push(c);names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>snap(c,i);bar.appendChild(b)});if(d.mirror){const b=document.createElement('button');b.textContent='Mirror-Looking Design';b.onclick=()=>{c.mirror=!c.mirror;b.classList.toggle('active',c.mirror);update(c);draw(c)};local.appendChild(b);c.mirrorBtn=b}else local.textContent='180° upside-down design';scene.onpointerdown=e=>{c.dra let spinning=true,rotationSpeed=.2,transparent=false,mirrorAllState=false,halfState=false;const spinAllBtn=document.getElementById('spinAll'),halfAllBtn=document.getElementById('halfAll'),mirrorAllBtn=document.getElementById('mirrorAll'),transAllBtn=document.getElementById('transAll'),resetAllBtn=document.getElementById('resetAll');function draw(c){c.cube.style.transform=`scale3d(${c.mirror?-1:1},1,1) rotateX(${c.rx}deg) rotateY(${c.ry}deg)`}function update(c){const modes=[];if(c.half)modes.push('180° orientation');if(c.mirror)modes.push('mirror-looking');if(transparent)modes.push('transparent');c.reading.textContent=modes.length?modes.join(' · ')+' — digits remain valid':'normal orientation'}function snap(c,i){spinning=false;spinAllBtn.textContent='Start All';spinAllBtn.classList.remove('active');c.half=false;c.rx=snaps[i][0];c.ry=snaps[i][1];c.chips.forEach((x,j)=>x.classList.toggle('active',i===j));update(c);draw(c)}function loop(){if(spinning)controllers.forEach(c=>{if(!c.drag){c.ry+=rotationSpeed;draw(c)}});requestAnimationFrame(loop)}loop();spinAllBtn.onclick=()=>{spinning=!spinning;spinAllBtn.textContent=spinning?'Pause All':'Start All';spinAllBtn.classList.toggle('active',spinning)};halfAllBtn.onclick=()=>{halfState=!halfState;controllers.forEach(c=>{c.half=halfState;c.ry+=180;update(c);draw(c)});halfAllBtn.classList.toggle('active',halfState)};mirrorAllBtn.onclick=()=>{mirrorAllState=!mirrorAllState;controllers.filter(c=>c.canMirror).forEach(c=>{c.mirror=mirrorAllState;if(c.mirrorBtn)c.mirrorBtn.classList.toggle('active',mirrorAllState);update(c);draw(c)});mirrorAllBtn.classList.toggle('active',mirrorAllState)};transAllBtn.onclick=()=>{transparent=!transparent;controllers.forEach(c=>{c.cube.classList.toggle('transparent',transparent);update(c)});transAllBtn.classList.toggle('active',transparent)};resetAllBtn.onclick=()=>{spinning=false;spinAllBtn.textContent='Start All';spinAllBtn.classList.remove('active');transparent=false;mirrorAllState=false;halfState=f
